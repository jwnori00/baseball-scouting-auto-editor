name: Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact_url: ${{ steps.bundle.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install Python build dependencies
        run: |
          New-Item -ItemType Directory -Force build-evidence | Out-Null
          python -m pip install -r requirements-build.txt 2>&1 | Tee-Object build-evidence/dependencies.log
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip check
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make nasm diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
      - name: Build pinned GPL FFmpeg and retain corresponding source
        shell: msys2 {0}
        run: |
          mkdir -p build-evidence
          set -o pipefail
          bash packaging/build_ffmpeg.sh 2>&1 | tee build-evidence/ffmpeg-build.log
      - name: Retain Qt and PySide corresponding source and licenses
        shell: pwsh
        run: |
          python packaging/fetch_qt_sources.py 2>&1 | Tee-Object build-evidence/qt-sources.log
          if ($LASTEXITCODE -ne 0) { throw 'Corresponding source preparation failed' }
      - name: Test existing editing features on Windows
        shell: pwsh
        run: |
          $env:PATH = "$pwd\vendor\ffmpeg\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m pytest -q 2>&1 | Tee-Object build-evidence/python-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows editing tests failed' }
      - name: Build portable onedir
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean BaseballScoutingEditor.spec 2>&1 | Tee-Object build-evidence/pyinstaller.log
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          python packaging/collect_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Redistribution notices missing' }
      - name: Verify bundle, code signature and standalone execution
        shell: pwsh
        run: ./packaging/test_portable.ps1
      - name: Upload Qt corresponding source beside the binaries
        uses: actions/upload-artifact@v4
        with:
          name: ThirdPartyCorrespondingSources
          path: vendor/qt-sources/
          compression-level: 0
          if-no-files-found: error
      - name: Create final ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BaseballScoutingEditor -DestinationPath BaseballScoutingEditor-Windows-x64.zip
          $hash = (Get-FileHash BaseballScoutingEditor-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BaseballScoutingEditor-Windows-x64.zip" | Out-File -Encoding ascii BaseballScoutingEditor-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        id: bundle
        with:
          name: BaseballScoutingEditor-Windows-x64
          path: |
            BaseballScoutingEditor-Windows-x64.zip
            BaseballScoutingEditor-Windows-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-evidence
          path: |
            build-evidence/
            vendor/ffmpeg/sources/build-version.txt
            vendor/ffmpeg/sources/encoders.txt
            vendor/ffmpeg/sources/ffmpeg-config.log
          if-no-files-found: warn
  publish-evidence:
    if: always() && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Windows-build-evidence
          path: ${{ runner.temp }}/windows-evidence
      - name: Publish bounded diagnostic evidence through Git
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
          EVIDENCE_PATH: ${{ runner.temp }}/windows-evidence
        run: python scripts/publish_build_evidence.py
  draft-private-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BaseballScoutingEditor-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ThirdPartyCorrespondingSources
          path: sources
      - name: Archive corresponding source
        run: tar -cf release/ThirdPartyCorrespondingSources.tar -C sources .
      - name: Attach portable ZIP to a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG Windows portable" --notes "Windows x64 onedir. Download ZIP, extract all files, open BaseballScoutingEditor.exe. AI pitch detection is not implemented." release/*
